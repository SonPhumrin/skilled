<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1440" width="980" height="1440" role="img" aria-label="skilled workflow: from idea to shipped, with design skills firing during build">
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
  .node rect { stroke-width:1.5; }
  .node-u rect { fill:#3b5bdb; stroke:#2437a8; }
  .node-u text { fill:#ffffff; }
  .node-m rect { fill:#7048e8; stroke:#5f3dc4; }
  .node-m text { fill:#ffffff; }
  .node-doc rect { fill:#495057; stroke:#343a40; stroke-dasharray:4 3; }
  .node-doc text { fill:#ffffff; }
  .node-end rect { fill:#2f9e44; stroke:#2b8a3e; }
  .node-end text { fill:#ffffff; }
  .node-chip rect { fill:#e9ecef; stroke:#ced4da; }
  .node-chip text { fill:#343a40; }
  .edge { stroke:#868e96; stroke-width:2; fill:none; }
  .edge-dash { stroke:#868e96; stroke-width:1.5; fill:none; stroke-dasharray:5 4; }
  .edge-arrow { fill:#868e96; }
  .edge-label { fill:#495057; font-size:12px; }
  .title-label { font-weight:600; font-size:14px; }
  .sub-label { font-size:11.5px; }
  .panel rect { fill:none; stroke:#adb5bd; stroke-width:1.25; stroke-dasharray:6 5; }
  .panel-title { fill:#343a40; font-size:12.5px; font-weight:600; }
  .caption { fill:#212529; font-size:13px; }
  @media (prefers-color-scheme: dark) {
    .node-u rect { fill:#4c6ef5; stroke:#91a7ff; }
    .node-m rect { fill:#9775fa; stroke:#d0bfff; }
    .node-doc rect { fill:#343a40; stroke:#adb5bd; }
    .node-end rect { fill:#37b24d; stroke:#8ce99a; }
    .node-chip rect { fill:#343a40; stroke:#868e96; }
    .node-chip text { fill:#f1f3f5; }
    .edge, .edge-dash { stroke:#adb5bd; }
    .edge-arrow { fill:#adb5bd; }
    .edge-label { fill:#dee2e6; }
    .panel rect { stroke:#868e96; }
    .panel-title { fill:#e9ecef; }
    .caption { fill:#f1f3f5; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="edge-arrow"/>
  </marker>
</defs>
<g class="node node-doc">
<rect x="315.0" y="30.0" width="230" height="60" rx="12" ry="12"/>
<text x="430.0" y="56.5" text-anchor="middle" font-size="12.5" class="sub-label">New idea, bug,</text>
<text x="430.0" y="73.5" text-anchor="middle" font-size="12.5" class="sub-label">or request</text>
</g>
<g class="node node-u">
<rect x="280.0" y="178.0" width="300" height="64" rx="12" ry="12"/>
<text x="430.0" y="206.5" text-anchor="middle" font-size="13.5" font-weight="600" class="title-label">/domain-interview</text>
<text x="430.0" y="223.5" text-anchor="middle" font-size="11" class="sub-label">(or /clarify-requirements)</text>
</g>
<g class="node node-u">
<rect x="340.0" y="372.0" width="180" height="56" rx="12" ry="12"/>
<text x="430.0" y="405.0" text-anchor="middle" font-size="13.5" font-weight="600" class="title-label">/write-spec</text>
</g>
<g class="node node-u">
<rect x="330.0" y="492.0" width="200" height="56" rx="12" ry="12"/>
<text x="430.0" y="525.0" text-anchor="middle" font-size="13.5" font-weight="600" class="title-label">/write-tickets</text>
</g>
<g class="node node-u">
<rect x="280.0" y="628.0" width="300" height="64" rx="12" ry="12"/>
<text x="430.0" y="656.5" text-anchor="middle" font-size="13.5" font-weight="600" class="title-label">/implement</text>
<text x="430.0" y="673.5" text-anchor="middle" font-size="10.5" class="sub-label">(or /implement-spec, whole graph)</text>
</g>
<g class="node node-m">
<rect x="335.0" y="772.0" width="190" height="56" rx="12" ry="12"/>
<text x="430.0" y="796.5" text-anchor="middle" font-size="13.5" font-weight="600" class="title-label">tdd</text>
<text x="430.0" y="813.5" text-anchor="middle" font-size="10.5" class="sub-label">red/green/refactor</text>
</g>
<g class="node node-m">
<rect x="300.0" y="902.0" width="260" height="56" rx="12" ry="12"/>
<text x="430.0" y="926.5" text-anchor="middle" font-size="13" font-weight="600" class="title-label">verify-in-browser</text>
<text x="430.0" y="943.5" text-anchor="middle" font-size="10.5" class="sub-label">if web UI touched</text>
</g>
<g class="node node-m">
<rect x="335.0" y="1022.0" width="190" height="56" rx="12" ry="12"/>
<text x="430.0" y="1055.0" text-anchor="middle" font-size="13.5" font-weight="600" class="title-label">review-diff</text>
</g>
<g class="node node-end">
<rect x="350.0" y="1122.0" width="160" height="56" rx="12" ry="12"/>
<text x="430.0" y="1155.0" text-anchor="middle" font-size="13.5" font-weight="600" class="title-label">committed</text>
</g>
<path d="M430,90.0 L430,178.0" class="edge" marker-end="url(#arrow)"/>
<path d="M430,242.0 L430,372.0" class="edge" marker-end="url(#arrow)"/>
<text x="525.0" y="305.0" text-anchor="middle" class="edge-label">small enough: skip the doc</text>
<path d="M430,428.0 L430,492.0" class="edge" marker-end="url(#arrow)"/>
<path d="M430,548.0 L430,628.0" class="edge" marker-end="url(#arrow)"/>
<path d="M430,692.0 L430,772.0" class="edge" marker-end="url(#arrow)"/>
<text x="430.0" y="724.0" text-anchor="middle" class="edge-label">at each agreed seam</text>
<path d="M430,828.0 L430,902.0" class="edge" marker-end="url(#arrow)"/>
<text x="430.0" y="857.0" text-anchor="middle" class="edge-label">before static review</text>
<path d="M430,958.0 L430,1022.0" class="edge" marker-end="url(#arrow)"/>
<path d="M430,1078.0 L430,1122.0" class="edge" marker-end="url(#arrow)"/>
<text x="430.0" y="1092.0" text-anchor="middle" class="edge-label">findings resolved</text>
<g class="node node-u">
<rect x="10.0" y="127.0" width="220" height="56" rx="12" ry="12"/>
<text x="120.0" y="151.5" text-anchor="middle" font-size="12.5" font-weight="600" class="title-label">/skilled-setup</text>
<text x="120.0" y="168.5" text-anchor="middle" font-size="10" class="sub-label">once, if CONTEXT.md missing</text>
</g>
<g class="node node-u">
<rect x="10.0" y="242.0" width="220" height="56" rx="12" ry="12"/>
<text x="120.0" y="266.5" text-anchor="middle" font-size="12.5" font-weight="600" class="title-label">/triage</text>
<text x="120.0" y="283.5" text-anchor="middle" font-size="10" class="sub-label">bugs &amp; requests piling up</text>
</g>
<path d="M230.0,155 C290.0,155 220.0,194 280.0,194" class="edge" marker-end="url(#arrow)"/>
<text x="250.0" y="140.0" text-anchor="middle" class="edge-label">first time only</text>
<path d="M230.0,270 C290.0,270 220.0,226 280.0,226" class="edge" marker-end="url(#arrow)"/>
<text x="250.0" y="290.0" text-anchor="middle" class="edge-label">moves ready items in</text>
<g class="node node-u">
<rect x="635.0" y="272.0" width="230" height="56" rx="12" ry="12"/>
<text x="750.0" y="296.5" text-anchor="middle" font-size="12.5" font-weight="600" class="title-label">/design-doc</text>
<text x="750.0" y="313.5" text-anchor="middle" font-size="10" class="sub-label">real architecture question</text>
</g>
<g class="node node-u">
<rect x="635.0" y="432.0" width="230" height="56" rx="12" ry="12"/>
<text x="750.0" y="456.5" text-anchor="middle" font-size="12.5" font-weight="600" class="title-label">/decision-map</text>
<text x="750.0" y="473.5" text-anchor="middle" font-size="10" class="sub-label">huge, foggy effort</text>
</g>
<path d="M580.0,200 C640.0,200 575.0,300 635.0,300" class="edge" marker-end="url(#arrow)"/>
<text x="650.0" y="245.0" text-anchor="middle" class="edge-label">big enough to need one</text>
<path d="M865.0,300 C760.0,300 610.0,380.0 520.0,380.0" class="edge" marker-end="url(#arrow)"/>
<text x="650.0" y="350.0" text-anchor="middle" class="edge-label">docs/design/*.md</text>
<path d="M865.0,460 C760.0,460 610.0,420.0 520.0,420.0" class="edge" marker-end="url(#arrow)"/>
<text x="650.0" y="430.0" text-anchor="middle" class="edge-label">once the fog clears</text>
<g class="panel"><rect x="640" y="720" width="300" height="210" rx="14" ry="14"/></g>
<text x="656" y="746" class="panel-title">design skills</text>
<text x="656" y="764" class="panel-title" style="font-weight:400">fire on their own during /implement</text>
<g class="node node-chip"><rect x="665.0" y="788.0" width="250" height="34" rx="8" ry="8"/><text x="790.0" y="809.0" text-anchor="middle" font-size="11.5">code-craft</text></g>
<g class="node node-chip"><rect x="665.0" y="830.0" width="250" height="34" rx="8" ry="8"/><text x="790.0" y="851.0" text-anchor="middle" font-size="11.5">module-design</text></g>
<g class="node node-chip"><rect x="665.0" y="872.0" width="250" height="34" rx="8" ry="8"/><text x="790.0" y="893.0" text-anchor="middle" font-size="11.5">observability</text></g>
<path d="M580.0,660 C640.0,660 580,760 640,760" class="edge-dash" marker-end="url(#arrow)"/>
<text x="570.0" y="735.0" text-anchor="middle" class="edge-label">fire on their own</text>
<g class="node node-u"><rect x="47" y="1267" width="26" height="26" rx="6"/></g>
<text x="82" y="1285" class="caption" font-size="12.5">you type it</text>
<g class="node node-m"><rect x="47" y="1302" width="26" height="26" rx="6"/></g>
<text x="82" y="1320" class="caption" font-size="12.5">fires on its own</text>
<g class="node node-doc"><rect x="47" y="1337" width="26" height="26" rx="6"/></g>
<text x="82" y="1355" class="caption" font-size="12.5">input / artifact</text>
<g class="node node-end"><rect x="47" y="1372" width="26" height="26" rx="6"/></g>
<text x="82" y="1390" class="caption" font-size="12.5">done</text>
<text x="40" y="34" class="caption" font-size="18" font-weight="600">How a change moves through skilled</text>
</svg>