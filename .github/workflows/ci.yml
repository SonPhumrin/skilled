name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shell checks
        if: runner.os != 'Windows'
        run: |
          bash -n install.sh
          if command -v shellcheck >/dev/null 2>&1; then shellcheck install.sh; fi
      - name: Validate skills and skills.json
        run: python tests/validate_skills.py
      - name: Installer and guardrail tests
        run: python -m unittest tests.test_install tests.test_git_guardrails -v
