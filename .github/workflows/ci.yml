name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shell checks
        if: runner.os != 'Windows'
        run: |
          bash -n install.sh
          if command -v shellcheck >/dev/null 2>&1; then shellcheck install.sh; fi
      - name: Validate skills and skills.json
        run: python tests/validate_skills.py
      - name: Installer and guardrail tests
        run: python -m unittest tests.test_install tests.test_git_guardrails -v

  unskilled:
    name: unskilled (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned CI builds
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5 # git-guardrails tests
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter unskilled typecheck
      - run: pnpm --filter unskilled test
      - run: pnpm --filter unskilled build
      - name: Package (unpacked)
        run: pnpm --filter unskilled exec electron-builder --dir --publish never
      - name: Smoke test the packaged app
        if: runner.os == 'Linux'
        run: xvfb-run -a node apps/unskilled/scripts/smoke.mjs
      - name: Smoke test the packaged app
        if: runner.os != 'Linux'
        run: node apps/unskilled/scripts/smoke.mjs
