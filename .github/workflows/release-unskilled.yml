name: release-unskilled

# Builds UnSkilled installers for every OS: push a tag like unskilled-v0.1.0,
# or run it by hand. Installers are unsigned until signing secrets exist.
on:
  push:
    tags: ["unskilled-v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter unskilled dist
      - uses: actions/upload-artifact@v4
        with:
          name: unskilled-${{ runner.os }}
          path: |
            apps/unskilled/dist/*.dmg
            apps/unskilled/dist/*.zip
            apps/unskilled/dist/*.exe
            apps/unskilled/dist/*.AppImage
          if-no-files-found: error
